name: CI Pipeline

on:
  push:
    branches:
      - master
      - main
      - dev
  pull_request:
    branches:
      - master
      - main

jobs:
  lint:
    name: Linting Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Server Dependencies
        run: npm ci --prefix server

      - name: Run Root Lint
        run: npm run lint

      - name: Run Server Lint
        run: npm run lint --prefix server

  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Server Dependencies
        run: npm ci --prefix server

      - name: Run Unit Tests with Coverage
        run: npm run test

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  integration-tests:
    name: Integration Tests (Vitest & Redis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Server Dependencies
        run: npm ci --prefix server

      - name: Run Integration Tests
        env:
          REDIS_URL: redis://localhost:6379
        run: npm run test:integration

  security:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Audit Root Dependencies
        run: npm audit --audit-level=moderate

      - name: Audit Server Dependencies
        run: npm audit --audit-level=moderate --prefix server

  e2e:
    name: E2E Tests (Playwright & Redis)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'master')
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Server Dependencies
        run: npm ci --prefix server

      - name: Build Frontend
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Start Application and Run E2E Tests
        env:
          REDIS_URL: redis://localhost:6379
          TEST_BASE_URL: http://localhost:4173
        run: |
          # Start Backend Server
          PORT=3001 REDIS_URL=redis://localhost:6379 node server/server.js &
          
          # Start Frontend Preview Server
          npm run preview &
          
          # Wait for backend liveness check and frontend server port
          npx wait-on http://localhost:3001/health http://localhost:4173
          
          # Run Playwright tests
          npm run test:e2e

      - name: Upload Playwright Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
