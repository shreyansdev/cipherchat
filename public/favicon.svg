<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Dark Mode Gradients -->
    <linearGradient id="shieldGradDark" x1="12" y1="6" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="lockGradDark" x1="23" y1="27" x2="41" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Light Mode Gradients -->
    <linearGradient id="shieldGradLight" x1="12" y1="6" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="lockGradLight" x1="23" y1="27" x2="41" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <style>
    :root {
      color-scheme: light dark;
    }
    /* Dark Mode (Default) */
    .shield-bg { fill: #0b0f19; fill-opacity: 0.95; }
    .shield-border { stroke: url(#shieldGradDark); stroke-width: 2.6; stroke-linejoin: round; }
    .circuit-line { stroke: #00f0ff; stroke-width: 1.4; stroke-linecap: round; opacity: 0.7; }
    .circuit-node { fill: #00f0ff; }
    .shackle { stroke: #e0f2fe; stroke-width: 2.4; stroke-linecap: round; }
    .lock-body { fill: url(#lockGradDark); }
    .keyhole { fill: #0b0f19; }

    /* Light Mode */
    @media (prefers-color-scheme: light) {
      .shield-bg { fill: #f8fafc; fill-opacity: 0.98; }
      .shield-border { stroke: url(#shieldGradLight); stroke-width: 2.6; }
      .circuit-line { stroke: #0284c7; stroke-width: 1.4; opacity: 0.85; }
      .circuit-node { fill: #0284c7; }
      .shackle { stroke: #0f172a; stroke-width: 2.4; }
      .lock-body { fill: url(#lockGradLight); }
      .keyhole { fill: #f8fafc; }
    }
  </style>

  <!-- Background Shield -->
  <path class="shield-bg shield-border" d="M 32 6 L 52 14 C 52 36, 43 49, 32 58 C 21 49, 12 36, 12 14 Z" />

  <!-- Cryptographic Circuit Accents -->
  <path class="circuit-line" d="M 20 20 L 25 24 M 44 20 L 39 24 M 32 46 L 32 51" />
  <circle class="circuit-node" cx="20" cy="20" r="1.5" />
  <circle class="circuit-node" cx="44" cy="20" r="1.5" />
  <circle class="circuit-node" cx="32" cy="51" r="1.5" />

  <!-- Shackle -->
  <path class="shackle" d="M 27 27 V 21 C 27 18.2 29.2 16 32 16 C 34.8 16 37 18.2 37 21 V 27" fill="none" />

  <!-- Lock Body -->
  <rect class="lock-body" x="23" y="27" width="18" height="15" rx="3" />

  <!-- Keyhole -->
  <circle class="keyhole" cx="32" cy="33.5" r="2" />
  <path class="keyhole" d="M 31.2 33.5 L 30.5 38.5 H 33.5 L 32.8 33.5 Z" />
</svg>
